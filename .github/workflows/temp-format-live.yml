name: Temporary format live recorder
on:
  push:
    branches: [ fix/live-hls-recorder ]
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[spotless applied]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/live-hls-recorder
          persist-credentials: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew && ./gradlew spotlessApply --build-cache
      - name: Commit formatting to feature branch only
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add app/src/main/java/io/github/aedev/flow/data/video/live app/src/main/java/io/github/aedev/flow/ui/components/shared/LiveRecordingDialog.kt app/src/test/java/io/github/aedev/flow/data/video/live
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Kotlin formatter [spotless applied]"
            git push origin HEAD:fix/live-hls-recorder
          fi
